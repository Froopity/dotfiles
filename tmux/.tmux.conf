# Enable mouse clicking + scrolling
set -g mouse on

# Enable true color
set -g default-terminal "${TERM}"
set -as terminal-overrides ",${TERM}*:Tc"

# Try to set terminal window/tab title
set -g set-titles on

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Focus events enabled
set -g focus-events on

# Use vi bindings for copy mode
set-window-option -g mode-keys vi

# Pane splits and windows should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Rename current window to current directory basename
bind-key r rename-window "#{b:pane_current_path}"

# Move windows around within session like dragging a tab around
bind-key . command-prompt -p "Move window to index:" "run-shell 'src=#{window_index}; dst=%%; if [ \$src -gt \$dst ]; then tmux move-window -b -t \$dst; else tmux move-window -a -t \$dst; fi; tmux move-window -r'"

# Move panes to other windows easily
bind-key M choose-window -F "#{window_index}: #{window_name}" "join-pane -v -t %%"
bind-key m choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%"

# Show current tab as green
set-window-option -g window-status-current-style bg=green,fg=black

# Yellow/Black for pwsh, Red/Black for cmd, Default/Transparent for everything else
set -g status-style "bg=#{?#{==:#W,pwsh},yellow,#{?#{==:#W,cmd},red,default}},fg=#{?#{==:#W,pwsh},black,#{?#{==:#W,cmd},black,default}}"

# Keybinds

# Source .tmux.conf as suggested in `man tmux`
bind R source-file ~/.tmux.conf

# Resurrect/Continuum settings
# Start tmux on system boot
set -g @continuum-boot 'on'
# Restore vim and nvim
# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'

# Plugins (managed by tpm, prefix + I to install)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
